name: wake-app

# เปิดหน้าเว็บด้วยเบราว์เซอร์ทุก 6 ชั่วโมง เพื่อไม่ให้แอป Streamlit ฟรีหลับ
# (GitHub จะปิด schedule อัตโนมัติถ้า repo ไม่มีกิจกรรม 60 วัน — กด Run workflow เพื่อเปิดใหม่)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/wake_app.py
        env:
          APP_URL: ${{ vars.APP_URL || 'https://rtaf-supply.streamlit.app' }}
